<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мастер щупалец: восхождение</title>
    <link rel="icon" type="image/png" href="assets/branding/favicon-64.png">
    <style>
        @font-face { font-family: 'Nunito'; src: url('assets/fonts/nunito.ttf?v=0.1.3-96f6ea74') format('truetype'); font-weight: 200 1000; font-style: normal; font-display: swap; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background: radial-gradient(ellipse at 50% 40%, #2a2377 0, #14102f 75%);
            z-index: 1000;
        }
        .loading-text {
            font: 800 15px 'Nunito', system-ui, sans-serif;
            color: #c9d6ff;
            text-align: center;
            min-height: 1em;
        }
        .loading-bar {
            width: min(260px, 70vw);
            height: 16px;
            background: #171347;
            border: 3px solid #14102f;
            box-shadow: 0 0 0 2px rgba(255,255,255,.85);
            border-radius: 10px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(#ffe070, #ffa71f 55%, #ee7b0c);
            transition: width 0.3s ease;
        }
        #loading-title { margin: 0; font: 1000 clamp(26px, 6vw, 46px)/1.05 'Nunito', system-ui, sans-serif; color: #fff; text-align: center; max-width: 86vw; text-transform: uppercase; -webkit-text-stroke: 7px #14102f; paint-order: stroke fill; text-shadow: 0 4px 0 #14102f; }
        .engine-mark { width: clamp(72px, 14vh, 140px); height: clamp(72px, 14vh, 140px); object-fit: contain; }
        #loading-percent { font: 1000 18px 'Nunito', system-ui, sans-serif; color: #ffe070; -webkit-text-stroke: 4px #14102f; paint-order: stroke fill; }
        #loading-retry { padding: 12px 26px; border: 4px solid #14102f; border-radius: 14px; background: linear-gradient(#7bf7a3, #25cb5c); color: #fff; font: 1000 18px 'Nunito', system-ui, sans-serif; -webkit-text-stroke: 4px #14102f; paint-order: stroke fill; cursor: pointer; box-shadow: 0 5px 0 #0b6a2b; }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <img class="engine-mark" src="assets/branding/logo-256.webp" alt="" aria-hidden="true">
        <h1 id="loading-title" data-t="title">Мастер щупалец: восхождение</h1>
        <div id="loading-percent">0%</div>
        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        <div class="loading-text" data-t="loading">Загрузка…</div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

    <!-- Порядок значим: Constants.js первым (остальные читают его глобалы), main.js последним -->
    <script src="https://games.pikabu.ru/sdk/sdk.js"></script>
<script src="js/Constants.js?v=0.1.3-96f6ea74"></script>
    <!-- 1.40 ads-ui: поле игры на десктопе не шире 2:1 (Playgama); вторым — его resize идёт раньше обработчиков движка -->
    <script src="js/ViewCap.js?v=0.1.3-96f6ea74"></script>
    <script src="libs/simplex-noise.js?v=0.1.3-96f6ea74"></script>
    <script src="libs/babylon.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Maps.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Maps2D.js?v=0.1.3-96f6ea74"></script>
    <script src="js/World2D.js?v=0.1.3-96f6ea74"></script>
    <script src="js/World3D.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Terrain3D.js?v=0.1.3-96f6ea74"></script>
    <script src="js/CameraControl.js?v=0.1.3-96f6ea74"></script>
    <!-- 1.40: камера не заслоняется сценой (столкновение, полупрозрачные заслоны) -->
    <script src="js/CameraSight.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Model3D.js?v=0.1.3-96f6ea74"></script>
    <script src="js/ModelFBX.js?v=0.1.3-96f6ea74"></script>
    <script src="js/ModelOBJ.js?v=0.1.3-96f6ea74"></script>
    <script src="js/ModelGLTF.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Location3D.js?v=0.1.3-96f6ea74"></script>
    <!-- world-a: Rig.js (риги и клипы), Nav.js (коллизии, высоты, пути) -->
    <script src="js/Rig.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Nav.js?v=0.1.3-96f6ea74"></script>
    <!-- 1.30 мир (world-b): уровни графики и время суток -->
    <script src="js/Quality.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Sky3D.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Pause.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Sound.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Lang.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Platform.js?v=0.1.3-96f6ea74"></script>
    <!-- Адаптеры площадок (Platform.register): Playgama; игра добавляет свои здесь же, после Platform.js -->
    <script src="js/PlatformPlaygama.js?v=0.1.3-96f6ea74"></script>
    <!-- Адаптеры Telegram Mini App, CrazyGames, Android-обёртки и сборки test (detect() выбирает площадку) -->
    <script src="js/PlatformTelegram.js?v=0.1.3-96f6ea74"></script>
    <script src="js/PlatformCrazy.js?v=0.1.3-96f6ea74"></script>
    <script src="js/PlatformPikabu.js?v=0.1.3-96f6ea74"></script>
    <script src="js/PlatformAndroid.js?v=0.1.3-96f6ea74"></script>
    <script src="js/PlatformTest.js?v=0.1.3-96f6ea74"></script>
    <script src="js/LoadingScreen.js?v=0.1.3-96f6ea74"></script>
    <script src="js/ParticleFX.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Telemetry.js?v=0.1.3-96f6ea74"></script>
    <!-- 1.30 systems-b: магазин косметики, Daily Gift, колесо фортуны (логика без UI, опт-ин: Shop/DailyGift/Wheel.init в Game.js) -->
    <script src="js/Shop.js?v=0.1.3-96f6ea74"></script>
    <script src="js/DailyGift.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Wheel.js?v=0.1.3-96f6ea74"></script>
    <!-- 1.30 systems-a: ввод, раскладка HUD, обучение. Opt-in: игра сама зовёт Input.init / HudLayout.init / Tutorial.init -->
    <script src="js/HudLayout.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Input.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Tutorial.js?v=0.1.3-96f6ea74"></script>
    <script src="js/LiveWater3D.js?v=0.1.3-96f6ea74"></script>
    <!-- 1.40 motion: физический блочный персонаж (opt-in). Порядок значим: MotionMath (GM) -> Humanoid -> MotionMatch -> CharacterPhysics -> Ragdoll -> Character -->
    <script src="js/MotionMath.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Humanoid.js?v=0.1.3-96f6ea74"></script>
    <script src="js/MotionMatch.js?v=0.1.3-96f6ea74"></script>
    <script src="js/CharacterPhysics.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Ragdoll.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Character.js?v=0.1.3-96f6ea74"></script>
    <!-- 1.40 obby (ветка obby): трасса из деталей карты, тело героя, боты и их чат, вид. Опт-ин: игра сама зовёт ObbyCourse.build / ObbyBots.init -->
    <script src="js/ObbyCourse.js?v=0.1.3-96f6ea74"></script>
    <script src="js/ObbyBody.js?v=0.1.3-96f6ea74"></script>
    <script src="js/ObbyChat.js?v=0.1.3-96f6ea74"></script>
    <script src="js/ObbyBots.js?v=0.1.3-96f6ea74"></script>
    <script src="js/ObbyCourseView.js?v=0.1.3-96f6ea74"></script>
    <script src="js/ObbyAvatar.js?v=0.1.3-96f6ea74"></script>
    <!-- Скрипты игры (js/Game.js и её модули) — здесь, до main.js -->
    <script src="js/GameData.js?v=0.1.3-96f6ea74"></script>
    <script src="js/GameStyle.js?v=0.1.3-96f6ea74"></script>
    <script src="js/SpiderAvatar.js?v=0.1.3-96f6ea74"></script>
    <script src="js/SpiderBody.js?v=0.1.3-96f6ea74"></script>
    <script src="js/SpiderArms.js?v=0.1.3-96f6ea74"></script>
    <script src="js/GameWorld.js?v=0.1.3-96f6ea74"></script>
    <script src="js/GameFx.js?v=0.1.3-96f6ea74"></script>
    <script src="js/GameBots.js?v=0.1.3-96f6ea74"></script>
    <script src="js/GameHudIcons.js?v=0.1.3-96f6ea74"></script>
    <script src="js/GameSfx.js?v=0.1.3-96f6ea74"></script>
    <script src="js/GameHud.js?v=0.1.3-96f6ea74"></script>
    <script src="js/GameHudShop.js?v=0.1.3-96f6ea74"></script>
    <script src="js/Game.js?v=0.1.3-96f6ea74"></script>
    <script src="js/main.js?v=0.1.3-96f6ea74"></script>
    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
</body>
</html>
